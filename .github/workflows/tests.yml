
name: REDCap Pipeline Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run synthetic pipeline tests
        run: |
          python -m unittest discover -s tests -v

      - name: Run end-to-end synthetic demonstration
        run: |
          python run_demo.py

      - name: Verify generated dashboard
        run: |
          python -c "from pathlib import Path; files=list(Path('runs').glob('demo_*/output/quality_dashboard.html')); assert len(files)==1, 'Expected one generated dashboard'; print('PASS: Synthetic dashboard generated')"